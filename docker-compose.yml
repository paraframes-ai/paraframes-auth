services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      PUBLIC_URL: "http://localhost:8080"
      DATABASE_URL: "postgres://auth:auth@db:5432/auth?sslmode=disable"
      # Passkey / WebAuthn relying party.
      WEBAUTHN_RP_ID: "localhost"
      WEBAUTHN_RP_NAME: "Paraframes"
      WEBAUTHN_RP_ORIGINS: "http://localhost:8080,http://localhost:5173"
      # Beta gating for passkeys. Change this before sharing with testers.
      BETA_ACCESS_CODE: "paraframes-beta"
      # Social login (fill in your real client IDs to enable).
      GOOGLE_CLIENT_IDS: ""
      APPLE_CLIENT_IDS: ""
      # Leave JWT_PRIVATE_KEY_PEM empty in dev to auto-generate an ephemeral key.
    ports:
      - "8080:8080"

volumes:
  pgdata:
